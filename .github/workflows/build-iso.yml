name: Build WINUX ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Python & Config Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit and integrity tests
        run: python -B -m unittest discover -s tests -v

  build-iso:
    name: Build Bootable WINUX ISO
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space for archiso squashfs build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Download and extract Arch Linux bootstrap rootfs
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir -p /tmp/arch-boot
          curl -fsSL -o /tmp/arch-boot/archlinux-bootstrap-x86_64.tar.zst \
            https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst
          sudo tar --zstd -xf /tmp/arch-boot/archlinux-bootstrap-x86_64.tar.zst -C /tmp/arch-boot
          sudo cp /etc/resolv.conf /tmp/arch-boot/root.x86_64/etc/resolv.conf
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' | sudo tee /tmp/arch-boot/root.x86_64/etc/pacman.d/mirrorlist >/dev/null
          echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' | sudo tee -a /tmp/arch-boot/root.x86_64/etc/pacman.d/mirrorlist >/dev/null
          sudo mount --bind /tmp/arch-boot/root.x86_64 /tmp/arch-boot/root.x86_64
          sudo mkdir -p /tmp/arch-boot/root.x86_64/winux
          sudo mount --bind "${{ github.workspace }}" /tmp/arch-boot/root.x86_64/winux

      - name: Build WINUX ISO inside Arch chroot
        run: |
          sudo /tmp/arch-boot/root.x86_64/bin/arch-chroot /tmp/arch-boot/root.x86_64 /bin/bash -ec '
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm archiso
            cd /winux
            chmod +x scripts/build-iso.sh scripts/test-qemu.sh
            ./scripts/build-iso.sh
          '

      - name: Cleanup chroot mounts and generate SHA256 checksums
        if: always()
        run: |
          sudo umount -R /tmp/arch-boot/root.x86_64/winux || true
          sudo umount -R /tmp/arch-boot/root.x86_64 || true
          if compgen -G "build/out/winux-*.iso" > /dev/null; then
            cd build/out
            sha256sum winux-*.iso > SHA256SUMS.txt
            ls -lh winux-*.iso SHA256SUMS.txt
          fi

      - name: Upload WINUX ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: winux-iso-x86_64
          path: |
            build/out/winux-*.iso
            build/out/SHA256SUMS.txt
          retention-days: 14
