modules-search: [ local ]

instances:
  - id: winux_prepare_initcpio
    module: shellprocess
    config: shellprocess-winux_prepare_initcpio.conf
  - id: winux_postinstall
    module: shellprocess
    config: shellprocess-winux_postinstall.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@winux_prepare_initcpio
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - shellprocess@winux_postinstall
      - umount
  - show:
      - finished

branding: default
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
